networks:
  soc_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  traefik:
    image: traefik:v3
    hostname: traefik
    command:
      - "--api=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true" 
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--serverstransport.insecureskipverify=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./config/traefik/certs:/certs:ro
    labels:
      - "traefik.http.routers.traefik.rule=Host(`traefik.server`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
    networks:
      soc_net:

  wazuh.manager:
    image: wazuh/wazuh-manager:4.13.0 #4.13.1
    hostname: wazuh.manager
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    env_file:
      - ./.env.manager
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      #- wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
    networks:
      soc_net:
        ipv4_address: 172.20.0.60

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.13.0 #4.13.1
    hostname: wazuh.indexer
    restart: always
    #ports:
    #  - "9200:9200"
    env_file:
      - ./.env.indexer
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml
    networks:
      soc_net:

  wazuh_dashboard:
    image: wazuh/wazuh-dashboard:4.13.0 #4.13.1
    hostname: wazuh.dashboard
    restart: always
    #ports:
    #  - "6443:5601"
    env_file:
      - ./.env.dashboard
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wazuh.rule=Host(`wazuh.server`)"
      - "traefik.http.routers.wazuh.entrypoints=websecure"
      - "traefik.http.routers.wazuh.tls=true"
      - "traefik.http.services.wazuh_dashboard.loadbalancer.server.port=5601"
      - "traefik.http.services.wazuh_dashboard.loadbalancer.server.scheme=https"
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager
    networks:
      soc_net:

  frontend:
    image: ghcr.io/shuffle/shuffle-frontend:latest
    container_name: shuffle-frontend
    hostname: shuffle-frontend
    #ports:
    #  - "3001:80"
    #  - "3443:443"
    networks:
      - soc_net
    environment:
      - BACKEND_HOSTNAME=shuffle-backend
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shuffle.rule=Host(`shuffle.server`)"
      - "traefik.http.routers.shuffle.entrypoints=websecure"
      - "traefik.http.routers.shuffle.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=443"
      - "traefik.http.services.frontend.loadbalancer.server.scheme=https"

  backend:
    image: ghcr.io/shuffle/shuffle-backend:latest
    container_name: shuffle-backend
    hostname: shuffle-backend
    restart: unless-stopped
    env_file: 
      - ./config/shuffle/.env
      - ./config/shuffle/.env.backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/shuffle/shuffle-apps:/shuffle-apps:z
      - ./config/shuffle/shuffle-files:/shuffle-files:z
    networks:
      - soc_net

  orborus:
    image: ghcr.io/shuffle/shuffle-orborus:latest
    container_name: shuffle-orborus
    hostname: shuffle-orborus
    restart: unless-stopped
    env_file: 
      - ./config/shuffle/.env
    security_opt:
      - seccomp:unconfined
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - soc_net

  opensearch:
    image: opensearchproject/opensearch:3.2.0
    hostname: shuffle-opensearch
    container_name: shuffle-opensearch
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - ./config/shuffle/.env.opensearch
    volumes:
      - shuffle-database:/usr/share/opensearch/data:z
    #ports:
    #  - 19200:9200
    networks:
      - soc_net

  thehive-db:
    image: postgres:14
    container_name: thehive-db
    env_file:
      - ./config/thehive/.env.db
    volumes:
      - thehive-db-data:/var/lib/postgresql/data
    networks:
      soc_net:

  thehive:
    image: strangebee/thehive:5.1
    container_name: thehive
    depends_on:
      - thehive-db
    env_file:
      - ./config/thehive/.env.thehive
    volumes:
      - ./config/thehive/application.conf:/etc/thehive/application.conf:ro
      - ./config/thehive/logback.xml:/etc/thehive/logback.xml:ro
    ports:
      - "9000:9000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.thehive.rule=Host(`thehive.server`)"
      - "traefik.http.routers.thehive.entrypoints=websecure"
      - "traefik.http.routers.thehive.tls=true"
      - "traefik.http.services.thehive.loadbalancer.server.port=9000"
    networks:
      soc_net:

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  #wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  thehive-db-data:
  shuffle-database:
